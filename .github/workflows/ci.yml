name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec:
    name: Latest stable Ruby
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - run: bundle exec rake spec
